<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EngConnect — Engineering Student Support Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
/* ============================================================
   EngConnect — token system
   Color:  Ink #14162B / Paper #F6F5F2 / Indigo #363A94 /
           Gold #E8A33D (beacon/guidance accent) / Teal #1F9C82 (verified)
   Type:   Space Grotesk (headings/UI) + Inter (body/reading)
   ============================================================ */
:root{
  --ink:#14162B; --ink-soft:#4A4D6B; --ink-faint:#8688A3;
  --paper:#F6F5F2; --paper-raised:#FFFFFF; --paper-dim:#ECEAE3;
  --indigo:#363A94; --indigo-deep:#22245C; --indigo-tint:#E9E9F7;
  --gold:#E8A33D; --gold-tint:#FBEBD2;
  --teal:#1C8E77; --teal-tint:#DEF2EC;
  --coral:#D9634C; --coral-tint:#FBE6E1;
  --line:rgba(20,22,43,0.11); --line-strong:rgba(20,22,43,0.2);
  --shadow: 0 1px 2px rgba(20,22,43,0.06), 0 8px 24px -12px rgba(20,22,43,0.18);
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
  --font-head:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2F1F8; --ink-soft:#C6C7DA; --ink-faint:#8688A3;
    --paper:#111226; --paper-raised:#181A33; --paper-dim:#1F2140;
    --indigo:#8C90E8; --indigo-deep:#C7C9F5; --indigo-tint:#242759;
    --gold:#F0B85C; --gold-tint:#3A2E17;
    --teal:#4FC8AD; --teal-tint:#123330;
    --coral:#EC8674; --coral-tint:#3A2019;
    --line:rgba(242,241,248,0.12); --line-strong:rgba(242,241,248,0.24);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F2F1F8; --ink-soft:#C6C7DA; --ink-faint:#8688A3;
  --paper:#111226; --paper-raised:#181A33; --paper-dim:#1F2140;
  --indigo:#8C90E8; --indigo-deep:#C7C9F5; --indigo-tint:#242759;
  --gold:#F0B85C; --gold-tint:#3A2E17;
  --teal:#4FC8AD; --teal-tint:#123330;
  --coral:#EC8674; --coral-tint:#3A2019;
  --line:rgba(242,241,248,0.12); --line-strong:rgba(242,241,248,0.24);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#root{height:100%;}
h1,h2,h3,h4,.font-head{font-family:var(--font-head); letter-spacing:-0.01em;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--gold-tint); color:var(--ink);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px;}

/* ---------- layout shell ---------- */
.shell{display:flex; min-height:100%;}
.sidebar{
  width:248px; flex-shrink:0; background:var(--paper-raised); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0;
  height:100vh; padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px 8px;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg,var(--indigo),var(--indigo-deep));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.brand-name{font-family:var(--font-head); font-weight:700; font-size:16.5px; line-height:1.1;}
.brand-sub{font-size:10.5px; color:var(--ink-faint); font-weight:500;}
.nav-list{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px;
  font-size:14px; font-weight:500; color:var(--ink-soft); cursor:pointer; border:none; background:none;
  width:100%; text-align:left; transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:var(--paper-dim); color:var(--ink);}
.nav-item.active{background:var(--indigo-tint); color:var(--indigo-deep); font-weight:600;}
:root[data-theme="dark"] .nav-item.active, .nav-item.active{color:var(--indigo);}
.nav-item svg{flex-shrink:0;}
.nav-count{margin-left:auto; font-size:11px; background:var(--paper-dim); color:var(--ink-faint); padding:1px 7px; border-radius:20px; font-weight:600;}
.nav-item.active .nav-count{background:var(--paper-raised); color:var(--indigo);}

.role-switch{border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:10px;}
.role-switch-label{font-size:10.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:0 2px 8px;}
.role-toggle{display:flex; background:var(--paper-dim); border-radius:9px; padding:3px; gap:2px;}
.role-toggle button{flex:1; padding:7px 4px; border:none; background:none; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; transition:.15s;}
.role-toggle button.active{background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
  padding:14px 26px; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.menu-btn{display:none; background:none; border:1px solid var(--line); border-radius:9px; padding:7px; cursor:pointer; color:var(--ink);}
.search-wrap{flex:1; max-width:420px; position:relative;}
.search-input{
  width:100%; padding:9px 12px 9px 36px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper-raised); color:var(--ink); font-size:13.5px; font-family:var(--font-body);
}
.search-input:focus{border-color:var(--indigo);}
.search-icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none;}
.search-drop{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:40; max-height:320px; overflow:auto; padding:6px;}
.search-drop-item{display:flex; flex-direction:column; gap:2px; padding:9px 10px; border-radius:8px; cursor:pointer;}
.search-drop-item:hover{background:var(--paper-dim);}
.search-drop-empty{padding:16px; font-size:13px; color:var(--ink-faint); text-align:center;}
.demo-pill{
  font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--coral); background:var(--coral-tint);
  padding:4px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0;
}
.bell-wrap{position:relative; flex-shrink:0;}
.bell-btn{background:var(--paper-raised); border:1px solid var(--line); width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); position:relative;}
.bell-dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--coral); border:1.5px solid var(--paper-raised);}
.notif-drop{position:absolute; right:0; top:calc(100% + 8px); width:300px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:40; overflow:hidden;}
.notif-head{padding:12px 14px; font-size:13px; font-weight:700; border-bottom:1px solid var(--line);}
.notif-item{padding:11px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink-soft); line-height:1.45;}
.notif-item:last-child{border-bottom:none;}
.notif-item b{color:var(--ink); font-weight:600;}
.notif-time{display:block; margin-top:3px; font-size:11px; color:var(--ink-faint);}

.content{padding:26px; max-width:1180px; width:100%; margin:0 auto; flex:1;}
.page-head{margin-bottom:22px;}
.page-eyebrow{font-size:12px; color:var(--indigo); font-weight:700; margin-bottom:6px;}
.page-title{font-size:26px; margin:0 0 6px; font-weight:700;}
.page-desc{color:var(--ink-soft); font-size:14px; max-width:64ch; line-height:1.55; margin:0;}

/* ---------- primitives ---------- */
.card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:13.5px;
  padding:10px 16px; border-radius:10px; border:1px solid transparent; cursor:pointer; font-family:inherit;
  transition:transform .08s ease, filter .12s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--indigo); color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.45; cursor:not-allowed;}
.btn-gold{background:var(--gold); color:var(--indigo-deep);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-ghost:hover{background:var(--paper-dim);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:8px;}
.btn-block{width:100%;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px;}
.badge-indigo{background:var(--indigo-tint); color:var(--indigo-deep);}
.badge-teal{background:var(--teal-tint); color:var(--teal);}
.badge-gold{background:var(--gold-tint); color:#8A5A11;}
:root[data-theme="dark"] .badge-gold{color:var(--gold);}
.badge-coral{background:var(--coral-tint); color:var(--coral);}
.badge-outline{background:transparent; border:1px solid var(--line-strong); color:var(--ink-soft);}

.chip{
  padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--paper-raised);
  font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:.12s;
}
.chip:hover{border-color:var(--line-strong);}
.chip.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}

/* identity badge — hex "anonymity" avatar: encodes year+branch, never identity */
.idhex{
  width:40px; height:40px; flex-shrink:0; clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff;
}
.idhex span{font-family:var(--font-head); font-weight:700; line-height:1;}
.idhex .yr{font-size:12px;} .idhex .br{font-size:7px; letter-spacing:.03em; margin-top:1px;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

.stat-card{padding:18px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.stat-card:hover{transform:translateY(-2px);}
.stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.stat-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;}
.stat-num{font-family:var(--font-head); font-size:26px; font-weight:700; line-height:1;}
.stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:5px; font-weight:500;}

.section-title{font-size:15px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between;}
.link-more{font-size:12.5px; color:var(--indigo); font-weight:600; cursor:pointer; border:none; background:none; padding:0;}

/* ---------- Ask Seniors ---------- */
.ask-card{padding:22px;}
.textarea{
  width:100%; min-height:120px; border:1px solid var(--line); border-radius:12px; padding:14px;
  font-family:var(--font-body); font-size:14.5px; color:var(--ink); background:var(--paper); resize:vertical; line-height:1.5;
}
.textarea:focus{border-color:var(--indigo);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px;}
.anon-note{
  display:flex; gap:10px; align-items:flex-start; background:var(--teal-tint); border-radius:12px; padding:12px 14px;
  font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px;
}
.anon-note svg{flex-shrink:0; color:var(--teal); margin-top:1px;}

/* ---------- My Questions ---------- */
.qrow{display:flex; align-items:center; gap:14px; padding:15px 18px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .1s;}
.qrow:last-child{border-bottom:none;}
.qrow:hover{background:var(--paper-dim);}
.qrow-id{font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--indigo); width:56px; flex-shrink:0;}
.qrow-body{flex:1; min-width:0;}
.qrow-text{font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.qrow-meta{font-size:11.5px; color:var(--ink-faint); margin-top:3px; display:flex; gap:8px; align-items:center;}
.qrow-answers{flex-shrink:0; text-align:right; font-size:12px; font-weight:700; color:var(--ink-soft);}
.qrow-answers.zero{color:var(--ink-faint); font-weight:500;}
.empty-state{padding:44px 20px; text-align:center; color:var(--ink-faint);}
.empty-state svg{margin-bottom:10px; opacity:.5;}
.empty-state p{font-size:13.5px; margin:4px 0 14px;}

/* ---------- Question detail ---------- */
.back-btn{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft); background:none; border:none; cursor:pointer; margin-bottom:16px; padding:0;}
.back-btn:hover{color:var(--ink);}
.qdetail-card{padding:22px; margin-bottom:18px;}
.qdetail-label{font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:9px;}
.qdetail-text{font-size:17px; line-height:1.5; font-weight:500; margin:0 0 14px;}
.qdetail-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.answers-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 14px;}
.answers-count{font-family:var(--font-head); font-weight:700; font-size:16px;}
.answer-card{padding:17px; margin-bottom:12px;}
.answer-top{display:flex; gap:12px; align-items:flex-start;}
.answer-meta{flex:1;}
.answer-senior{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
.answer-exp{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.answer-text{font-size:14px; line-height:1.6; color:var(--ink); margin:11px 0 0;}
.answer-foot{display:flex; align-items:center; gap:12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
.helpful-btn{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:none; cursor:pointer; color:var(--ink-soft);}
.helpful-btn.on{background:var(--teal-tint); border-color:transparent; color:var(--teal);}
.new-answer-flash{animation:flashIn .9s ease;}
@keyframes flashIn{0%{background:var(--gold-tint); box-shadow:0 0 0 2px var(--gold);} 100%{background:var(--paper-raised); box-shadow:none;}}

.wht-card{padding:18px;}
.wht-count{font-size:13.5px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.wht-count b{color:var(--indigo); font-family:var(--font-head); font-size:16px;}
.wht-item{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--line);}
.wht-item:last-child{border-bottom:none;}
.wht-name{font-size:12.5px; font-weight:600;}
.wht-topic{font-size:11.5px; color:var(--ink-faint);}

/* ---------- Senior view ---------- */
.senior-banner{display:flex; align-items:center; gap:12px; background:var(--indigo-deep); color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:20px;}
.senior-banner svg{flex-shrink:0;}
.senior-banner b{font-family:var(--font-head);}
.senior-banner p{margin:2px 0 0; font-size:12.5px; opacity:.85; line-height:1.5;}
.answer-box{border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:14px; background:var(--paper);}

/* ---------- Opportunities ---------- */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center;}
.select{padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); font-size:13px; font-family:inherit; font-weight:500;}
.opp-card{padding:18px; display:flex; flex-direction:column; gap:10px;}
.opp-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.opp-title{font-size:14.5px; font-weight:700; margin:0; line-height:1.35;}
.opp-org{font-size:12px; color:var(--ink-faint); margin-top:3px;}
.opp-tags{display:flex; flex-wrap:wrap; gap:6px;}
.opp-foot{display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:11.5px; color:var(--ink-faint);}

/* ---------- Roadmap ---------- */
.roadmap-form{padding:22px; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:end;}
@media (max-width:780px){.roadmap-form{grid-template-columns:1fr 1fr;}}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
.timeline{position:relative; padding-left:26px; margin-top:22px;}
.timeline::before{content:'';position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--line-strong);}
.tl-item{position:relative; padding-bottom:22px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; left:-26px; top:2px; width:18px; height:18px; border-radius:50%; background:var(--indigo); border:3px solid var(--paper); box-shadow:0 0 0 1px var(--line);}
.tl-card{padding:14px 16px;}
.tl-title{font-size:13.5px; font-weight:700; margin:0 0 3px;}
.tl-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0;}

/* ---------- Experiences ---------- */
.exp-card{padding:17px;}
.exp-top{display:flex; gap:11px; align-items:center;}
.exp-topic{font-size:13.5px; font-weight:700; margin-top:2px;}
.exp-quote{font-size:13px; color:var(--ink-soft); line-height:1.55; margin:11px 0 0;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
  padding:13px 20px; border-radius:12px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.4); z-index:100; max-width:90vw;
  padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));
}
.toast b{color:var(--gold);}

/* ---------- mobile ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;}
@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; z-index:30; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:flex; align-items:center; justify-content:center;}
  .content{padding:18px;}
  .topbar{padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));}
  .roadmap-form{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){
  .search-wrap{display:none;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .roadmap-form{grid-template-columns:1fr;}
}
.scrollx{overflow-x:auto;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

/* ==========================================================================
   LIVE BACKEND CONFIG
   --------------------------------------------------------------------------
   Set this to your deployed API's base URL (see backend README, step 4).
   Example: "https://engconnect-api.onrender.com/api"
   Left as "/api" by default so it also works if you ever serve this file
   from the SAME host as the API (a reverse proxy on one domain).
   ========================================================================== */
const API_BASE = "https://engconnect.onrender.com/api"; // <-- CHANGE THIS to your deployed backend URL + "/api"

const CATEGORIES = ["Academics","Labs","Internships","Placements","Projects","Hackathons","Career","College Life"];
const BRANCHES = ["CSE","IT","ECE","EEE","MECH","CIVIL"];
const BRANCH_COLOR = { CSE:"#363A94", IT:"#1C8E77", ECE:"#B4762A", EEE:"#7A4FB5", MECH:"#C4562F", CIVIL:"#3D7A8C" };
const CAREER_INTERESTS = ["Software / SDE","Core Engineering","Higher Studies","Government / PSU","Entrepreneurship"];
const YEAR_WORD = {1:"1st",2:"2nd",3:"3rd",4:"4th"};

/* ---- thin API client — every function here is a real HTTP call --------- */
async function request(path, {method="GET", token, body}={}){
  const headers = {"Content-Type":"application/json"};
  if(token) headers.Authorization = `Bearer ${token}`;
  let res;
  try{
    res = await fetch(`${API_BASE}${path}`, {method, headers, body: body?JSON.stringify(body):undefined});
  }catch(networkErr){
    throw new Error("Can't reach the EngConnect server. Check API_BASE at the top of this file and that the backend is running.");
  }
  let data = {};
  try{ data = await res.json(); }catch(e){ /* empty body is fine */ }
  if(!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
const api = {
  register: (payload) => request("/auth/register", {method:"POST", body:payload}),
  login: (payload) => request("/auth/login", {method:"POST", body:payload}),
  me: (token) => request("/auth/me", {token}),
  myQuestions: (token) => request("/questions/mine", {token}),
  createQuestion: (token, payload) => request("/questions", {method:"POST", token, body:payload}),
  questionDetail: (token, id) => request(`/questions/${id}`, {token}),
  queue: (token) => request("/questions/queue/unanswered", {token}),
  answer: (token, qid, payload) => request(`/answers/${qid}`, {method:"POST", token, body:payload}),
  helpful: (token, aid) => request(`/answers/helpful/${aid}`, {method:"POST", token}),
  opportunities: (token, params) => {
    const qs = Object.entries(params).filter(([,v])=>v && v!=="All").map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join("&");
    return request(`/opportunities${qs?`?${qs}`:""}`, {token});
  },
  experiences: (token, category) => request(`/experiences${category&&category!=="All"?`?category=${encodeURIComponent(category)}`:""}`, {token}),
  roadmap: (token, interest) => request("/roadmap", {method:"POST", token, body:{interest}}),
};

function loadSession(){
  try{
    const raw = localStorage.getItem("engconnect_session_v1");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSession(session){
  try{
    if(session) localStorage.setItem("engconnect_session_v1", JSON.stringify(session));
    else localStorage.removeItem("engconnect_session_v1");
  }catch(e){ console.warn("Could not persist session", e); }
}

/* ==========================================================================
   AUTH GATE — real registration / login against the backend
   ========================================================================== */
function AuthGate({onAuthed}){
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [year, setYear] = useState(2);
  const [branch, setBranch] = useState("CSE");
  const [role, setRole] = useState("student");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  async function submit(e){
    e.preventDefault();
    setBusy(true); setError("");
    try{
      const payload = mode==="login" ? {email,password} : {email,password,year,branch,role};
      const data = mode==="login" ? await api.login(payload) : await api.register(payload);
      saveSession({token:data.token, user:data.user});
      onAuthed({token:data.token, user:data.user});
    }catch(err){
      setError(err.message);
    }finally{ setBusy(false); }
  }

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="card" style={{width:"100%",maxWidth:400,padding:26}}>
        <div className="brand" style={{padding:"0 0 18px"}}>
          <div className="brand-mark"><Icon name="compass" size={18} stroke="#fff"/></div>
          <div><div className="brand-name">EngConnect</div><div className="brand-sub">Student Support Platform</div></div>
        </div>
        <div className="role-toggle" style={{marginBottom:18}}>
          <button className={mode==="login"?"active":""} onClick={()=>setError("")||setMode("login")} type="button">Log in</button>
          <button className={mode==="register"?"active":""} onClick={()=>setError("")||setMode("register")} type="button">Create account</button>
        </div>
        <ErrorNote message={error}/>
        <form onSubmit={submit}>
          <div className="field" style={{marginBottom:12}}>
            <label>College email</label>
            <input className="select" style={{width:"100%"}} type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@college.edu"/>
          </div>
          <div className="field" style={{marginBottom:12}}>
            <label>Password</label>
            <input className="select" style={{width:"100%"}} type="password" required minLength={8} value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 8 characters"/>
          </div>
          {mode==="register" && (
            <>
              <div style={{display:"flex",gap:10,marginBottom:12}}>
                <div className="field" style={{flex:1}}>
                  <label>Year</label>
                  <select className="select" style={{width:"100%"}} value={year} onChange={e=>setYear(Number(e.target.value))}>
                    {[1,2,3,4].map(y=><option key={y} value={y}>{YEAR_WORD[y]} Year</option>)}
                  </select>
                </div>
                <div className="field" style={{flex:1}}>
                  <label>Branch</label>
                  <select className="select" style={{width:"100%"}} value={branch} onChange={e=>setBranch(e.target.value)}>
                    {BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}
                  </select>
                </div>
              </div>
              <div className="field" style={{marginBottom:16}}>
                <label>I am a</label>
                <select className="select" style={{width:"100%"}} value={role} onChange={e=>setRole(e.target.value)}>
                  <option value="student">Junior — asking questions</option>
                  <option value="senior">Senior (3rd/4th year) — answering questions</option>
                </select>
              </div>
              {role==="senior" && (
                <div className="anon-note"><Icon name="shield" size={15}/><span>Senior accounts need verification before they can answer. You can browse right after signing up; answering unlocks once an admin verifies you.</span></div>
              )}
            </>
          )}
          <button className="btn btn-primary btn-block" disabled={busy} type="submit" style={{marginTop:4}}>
            {busy ? "Please wait…" : mode==="login" ? "Log in" : "Create account"}
          </button>
        </form>
        <div style={{fontSize:11.5,color:"var(--ink-faint)",marginTop:16,lineHeight:1.5}}>
          Your name is never asked for and is never shown to other students — only your year and branch appear next to anything you post.
        </div>
      </div>
    </div>
  );
}

/* ==========================================================================
   APP
   ========================================================================== */
const NAV = [
  {key:"home", label:"Home", icon:"home"},
  {key:"ask", label:"Ask Seniors", icon:"ask"},
  {key:"mine", label:"My Questions", icon:"list"},
  {key:"opportunities", label:"Opportunities", icon:"compass"},
  {key:"roadmap", label:"Roadmap", icon:"map"},
  {key:"experiences", label:"Experiences", icon:"users"},
];

function App(){
  const [session, setSession] = useState(loadSession());
  const [view, setView] = useState("home");
  const [activeQid, setActiveQid] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [myQuestions, setMyQuestions] = useState([]);
  const [myQuestionsLoading, setMyQuestionsLoading] = useState(false);
  const [queue, setQueue] = useState([]);
  const [queueLoading, setQueueLoading] = useState(false);
  const [activeQuestion, setActiveQuestion] = useState(null);
  const [activeLoading, setActiveLoading] = useState(false);
  const notifRef = useRef(null);

  const token = session?.token;
  const user = session?.user;
  const role = user?.role;

  function showToast(text, tone){ setToast({text, tone}); }
  function logout(){ saveSession(null); setSession(null); }

  const goto = useCallback((v, qid)=>{
    setView(v); if(qid) setActiveQid(qid);
    setSidebarOpen(false);
    window.scrollTo({top:0, behavior:"smooth"});
  },[]);

  const refreshMine = useCallback(()=>{
    if(!token) return;
    setMyQuestionsLoading(true);
    api.myQuestions(token).then(d=>setMyQuestions(d.questions)).catch(e=>showToast(e.message,"error")).finally(()=>setMyQuestionsLoading(false));
  },[token]);

  const refreshQueue = useCallback(()=>{
    if(!token || role!=="senior") return;
    setQueueLoading(true);
    api.queue(token).then(d=>setQueue(d.questions)).catch(e=>showToast(e.message,"error")).finally(()=>setQueueLoading(false));
  },[token, role]);

  useEffect(()=>{ if(session){ role==="senior" ? refreshQueue() : refreshMine(); } },[session]); // eslint-disable-line

  useEffect(()=>{
    if(!token || !activeQid) return;
    if(view!=="detail" && view!=="senior-answer") return;
    setActiveLoading(true);
    api.questionDetail(token, activeQid).then(d=>setActiveQuestion(d.question)).catch(e=>showToast(e.message,"error")).finally(()=>setActiveLoading(false));
  },[token, activeQid, view]);

  useEffect(()=>{
    function onDocClick(e){ if(notifRef.current && !notifRef.current.contains(e.target)) setNotifOpen(false); }
    document.addEventListener("mousedown", onDocClick);
    return ()=>document.removeEventListener("mousedown", onDocClick);
  },[]);

  if(!session){
    return <AuthGate onAuthed={setSession}/>;
  }

  function handleCreateQuestion(payload){
    api.createQuestion(token, payload).then(({question})=>{
      showToast(`Posted anonymously — you're <b>${question.id}</b>`);
      goto("mine");
      refreshMine();
    }).catch(e=>showToast(e.message,"error"));
  }

  function handleMarkHelpful(aid){
    api.helpful(token, aid).then(({helpfulByMe, helpfulCount})=>{
      setActiveQuestion(prev=>prev ? {...prev, answers:prev.answers.map(a=>a.id===aid?{...a,helpfulByMe,helpfulCount}:a)} : prev);
    }).catch(e=>showToast(e.message,"error"));
  }

  function handleSeniorAnswer(qid, payload){
    api.answer(token, qid, payload).then(({answerCount})=>{
      showToast(`Answer posted anonymously on <b>${qid}</b> — now ${answerCount} senior answer${answerCount===1?"":"s"}`);
      goto("senior-queue");
      refreshQueue();
    }).catch(e=>showToast(e.message,"error"));
  }

  const searchable = [...myQuestions, ...queue];

  return (
    <div className="shell">
      {sidebarOpen && <div className="overlay" onClick={()=>setSidebarOpen(false)}/>}
      <aside className={"sidebar" + (sidebarOpen ? " open" : "")}>
        <div className="brand">
          <div className="brand-mark"><Icon name="compass" size={18} stroke="#fff"/></div>
          <div><div className="brand-name">EngConnect</div><div className="brand-sub">Student Support Platform</div></div>
        </div>
        <nav className="nav-list">
          {NAV.map(n=>(
            <button key={n.key} className={"nav-item" + (view===n.key?" active":"")} onClick={()=>goto(n.key)}>
              <Icon name={n.icon} size={17}/><span>{n.label}</span>
              {n.key==="mine" && <span className="nav-count">{myQuestions.length}</span>}
            </button>
          ))}
          {role==="senior" && (
            <button className={"nav-item" + (view==="senior-queue"?" active":"")} onClick={()=>goto("senior-queue")}>
              <Icon name="shield" size={17}/><span>Answer Queue</span>
              <span className="nav-count">{queue.length}</span>
            </button>
          )}
        </nav>
        <div className="role-switch">
          <div className="role-switch-label">Signed in as</div>
          <div style={{padding:"2px 4px 10px", fontSize:12.5}}>
            <b>{YEAR_WORD[user.year]} Year {user.branch}</b><br/>
            <span style={{color:"var(--ink-faint)"}}>
              {role==="senior" ? (user.isVerified ? "Verified senior" : "Senior — pending verification") : "Junior"}
            </span>
          </div>
          <button className="btn btn-ghost btn-sm btn-block" onClick={logout}><Icon name="logout" size={14}/> Log out</button>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <button className="menu-btn" onClick={()=>setSidebarOpen(true)} aria-label="Open menu"><Icon name="menu"/></button>
          <div className="search-wrap">
            <Icon name="search" size={16} className="search-icon"/>
            <input className="search-input" placeholder="Search your questions & queue…" onFocus={()=>{}} />
          </div>
          <span className="demo-pill" style={{background:"var(--teal-tint)", color:"var(--teal)"}}>LIVE BACKEND</span>
          <div className="bell-wrap" ref={notifRef}>
            <button className="bell-btn" onClick={()=>setNotifOpen(o=>!o)} aria-label="Notifications">
              <Icon name="bell" size={17}/><span className="bell-dot"/>
            </button>
            {notifOpen && (
              <div className="notif-drop">
                <div className="notif-head">Notifications</div>
                <div className="notif-item">You're connected to a live database — notifications here are a placeholder for a future real-time feed.<span className="notif-time">now</span></div>
              </div>
            )}
          </div>
        </header>

        <main className="content">
          {view==="home" && <Home role={role} user={user} myQuestions={myQuestions} queue={queue} goto={goto}/>}
          {view==="ask" && <AskSeniors user={user} onSubmit={handleCreateQuestion}/>}
          {view==="mine" && <MyQuestions loading={myQuestionsLoading} myQuestions={myQuestions} goto={goto}/>}
          {view==="detail" && (activeLoading ? <Spinner/> : activeQuestion && <QuestionDetail token={token} q={activeQuestion} goto={goto} onHelpful={handleMarkHelpful}/>)}
          {view==="opportunities" && <Opportunities token={token}/>}
          {view==="roadmap" && <Roadmap token={token}/>}
          {view==="experiences" && <Experiences token={token}/>}
          {view==="senior-queue" && <SeniorQueue loading={queueLoading} questions={queue} goto={goto}/>}
          {view==="senior-answer" && (activeLoading ? <Spinner/> : activeQuestion && <SeniorAnswer user={user} q={activeQuestion} goto={goto} onSubmit={handleSeniorAnswer}/>)}
        </main>
      </div>
      {toast && <Toast text={toast.text} tone={toast.tone} onDone={()=>setToast(null)}/>}
    </div>
  );
}

      <div style={{marginTop:28}} className="card" style={{padding:20}}>
        <div className="section-title">Recent activity<button className="link-more" onClick={()=>goto("mine")}>View all</button></div>
        {myQuestions.length===0 && <div style={{fontSize:13,color:"var(--ink-faint)",padding:"12px 0"}}>You haven't asked anything yet.</div>}
        {myQuestions.slice(0,4).map(q=>(
          <div key={q.id} className="qrow" style={{padding:"11px 0"}} onClick={()=>goto("detail", q.id)}>
            <div className="qrow-id">{q.id}</div>
            <div className="qrow-body">
              <div className="qrow-text">{q.text}</div>
              <div className="qrow-meta"><Badge tone="indigo">{q.category}</Badge></div>
            </div>
            <div className={"qrow-answers" + (q.answers.length===0?" zero":"")}>{q.answers.length===0 ? "No answers yet" : `${q.answers.length} answers`}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- ASK SENIORS ---------------- */
function AskSeniors({user, onSubmit}){
  const [text, setText] = useState("");
  const [category, setCategory] = useState("Internships");
  const [submitting, setSubmitting] = useState(false);

  return (
    <div>
      <div className="page-head">
        <div className="page-eyebrow">ASK SENIORS · ANONYMOUS</div>
        <h1 className="page-title">Ask a question, anonymously</h1>
        <p className="page-desc">Your question is shown to verified seniors with your year and branch only.</p>
      </div>
      <div className="card ask-card" style={{maxWidth:640}}>
        <div className="anon-note">
          <Icon name="shield" size={16}/>
          <span>Posted as <b>Anonymous {YEAR_WORD[user.year]}-Year {user.branch} Student</b>. Seniors will never see your name, email or profile.</span>
        </div>
        <textarea className="textarea" placeholder="e.g. I'm in 2nd year CSE. What skills should I learn before applying for internships?"
          value={text} onChange={e=>setText(e.target.value)} />
        <div style={{marginTop:16, fontSize:12, fontWeight:700, color:"var(--ink-faint)", textTransform:"uppercase", letterSpacing:".03em"}}>Category</div>
        <div className="chip-row">
          {CATEGORIES.map(c=><button key={c} className={"chip" + (category===c?" active":"")} onClick={()=>setCategory(c)}>{c}</button>)}
        </div>
        <button className="btn btn-primary btn-block" style={{marginTop:14}} disabled={text.trim().length<8 || submitting}
          onClick={()=>{ setSubmitting(true); onSubmit({text:text.trim(), category}); setText(""); setSubmitting(false); }}>
          <Icon name="shield" size={15}/> Post Anonymously
        </button>
      </div>
    </div>
  );
}

/* ---------------- MY QUESTIONS ---------------- */
function MyQuestions({loading, myQuestions, goto}){
  return (
    <div>
      <div className="page-head">
        <div className="page-eyebrow">MY QUESTIONS</div>
        <h1 className="page-title">Your posted questions</h1>
        <p className="page-desc">Answer counts come straight from the database and update as verified seniors respond.</p>
      </div>
      <div className="card">
        {loading && <Spinner/>}
        {!loading && myQuestions.length===0 && (
          <div className="empty-state"><Icon name="ask" size={30}/><p>You haven't asked anything yet.</p><button className="btn btn-primary btn-sm" onClick={()=>goto("ask")}>Ask Seniors</button></div>
        )}
        {!loading && myQuestions.map(q=>(
          <div key={q.id} className="qrow" onClick={()=>goto("detail", q.id)}>
            <div className="qrow-id">{q.id}</div>
            <div className="qrow-body">
              <div className="qrow-text">{q.text}</div>
              <div className="qrow-meta"><Badge tone="indigo">{q.category}</Badge></div>
            </div>
            <div className={"qrow-answers" + (q.answers.length===0?" zero":"")}>{q.answers.length===0 ? "0 answers" : `${q.answers.length} answer${q.answers.length===1?"":"s"}`}</div>
            <Icon name="chevron-right" size={16} style={{color:"var(--ink-faint)", flexShrink:0}}/>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- QUESTION DETAIL ---------------- */
function QuestionDetail({q, goto, onHelpful}){
  return (
    <div>
      <button className="back-btn" onClick={()=>goto(q.mine ? "mine" : "senior-queue")}><Icon name="arrow-left" size={15}/> Back</button>
      <div className="card qdetail-card">
        <div className="qdetail-label">{q.mine ? "Your Question" : "Question"} · {q.id}</div>
        <p className="qdetail-text">{q.text}</p>
        <div className="qdetail-foot">
          <Badge tone="indigo">{q.category}</Badge>
          <Badge tone="outline" icon="shield">Posted anonymously</Badge>
        </div>
      </div>
      <div className="answers-head">
        <span className="answers-count">{q.answers.length} Senior Answer{q.answers.length===1?"":"s"}</span>
        <Badge tone="teal" icon="shield">Anonymous both ways</Badge>
      </div>
      {q.answers.length===0 && (
        <div className="card empty-state"><Icon name="ask" size={28}/><p>No senior has answered yet — verified seniors in this category will see it soon.</p></div>
      )}
      {q.answers.map(a=>(
        <div key={a.id} className="card answer-card">
          <div className="answer-top">
            <IdHex year={a.seniorYear} branch={a.seniorBranch}/>
            <div className="answer-meta">
              <div className="answer-senior"><Icon name="shield" size={13} stroke="#1C8E77"/> Verified Senior — {a.seniorBranch}, {YEAR_WORD[a.seniorYear]} Year</div>
              <div className="answer-exp">{a.exp}</div>
            </div>
          </div>
          <p className="answer-text">"{a.text}"</p>
          {q.mine && (
            <div className="answer-foot">
              <button className={"helpful-btn" + (a.helpfulByMe?" on":"")} onClick={()=>onHelpful(a.id)}>
                <Icon name="heart" size={13}/> {a.helpfulByMe ? "Marked Helpful" : "Mark Helpful"}
              </button>
              <span style={{fontSize:11.5, color:"var(--ink-faint)"}}>{a.helpfulCount} found this helpful</span>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ---------------- SENIOR QUEUE ---------------- */
function SeniorQueue({loading, questions, goto}){
  return (
    <div>
      <div className="page-head">
        <div className="page-eyebrow">SENIOR VIEW · LIVE DATA</div>
        <h1 className="page-title">Questions you haven't answered yet</h1>
        <p className="page-desc">You'll only ever see the asker's year and branch — never their identity.</p>
      </div>
      <div className="card">
        {loading && <Spinner/>}
        {!loading && questions.length===0 && <div className="empty-state"><Icon name="check" size={28}/><p>You're all caught up — no open questions right now.</p></div>}
        {!loading && questions.map(q=>(
          <div key={q.id} className="qrow" onClick={()=>goto("senior-answer", q.id)}>
            <IdHex year={q.askedYear} branch={q.askedBranch} size={38}/>
            <div className="qrow-body">
              <div style={{fontSize:11.5, color:"var(--ink-faint)", marginBottom:2}}>{q.id} · Anonymous {YEAR_WORD[q.askedYear]}-Year {q.askedBranch} Student asks:</div>
              <div className="qrow-text" style={{whiteSpace:"normal"}}>"{q.text}"</div>
              <div className="qrow-meta"><Badge tone="indigo">{q.category}</Badge>{q.answerCount>0 && <span>· {q.answerCount} answered so far</span>}</div>
            </div>
            <button className="btn btn-gold btn-sm">Answer Anonymously</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function SeniorAnswer({user, q, goto, onSubmit}){
  const [text, setText] = useState("");
  const [seniorExp, setSeniorExp] = useState("");

  return (
    <div>
      <button className="back-btn" onClick={()=>goto("senior-queue")}><Icon name="arrow-left" size={15}/> Back to queue</button>
      <div className="senior-banner">
        <Icon name="shield" size={24}/>
        <div><b>Strict anonymity is on.</b><p>The asker will only see "Verified Senior — {user.branch}, {YEAR_WORD[user.year]} Year". Your identity stays hidden.</p></div>
      </div>
      <div className="card qdetail-card">
        <div className="qdetail-label">{q.id} · Anonymous {YEAR_WORD[q.askedYear]}-Year {q.askedBranch} Student asks</div>
        <p className="qdetail-text">"{q.text}"</p>
        <Badge tone="indigo">{q.category}</Badge>
        {q.answers.length>0 && <span style={{marginLeft:10, fontSize:12, color:"var(--ink-faint)"}}>{q.answers.length} senior{q.answers.length===1?"":"s"} already answered</span>}
      </div>
      <div className="card answer-box">
        <div className="field" style={{marginBottom:14}}>
          <label>Relevant experience (shown to junior, no identity)</label>
          <input className="select" style={{width:"100%"}} placeholder="e.g. 2 internships, placement committee volunteer" value={seniorExp} onChange={e=>setSeniorExp(e.target.value)}/>
        </div>
        <div className="field" style={{marginBottom:14}}>
          <label>Your answer</label>
          <textarea className="textarea" style={{minHeight:100}} placeholder="Share honest, specific advice…" value={text} onChange={e=>setText(e.target.value)}/>
        </div>
        <button className="btn btn-gold btn-block" disabled={text.trim().length<8}
          onClick={()=>onSubmit(q.id, {text:text.trim(), experience:seniorExp.trim()||"Verified senior"})}>
          <Icon name="shield" size={15}/> Submit Answer Anonymously
        </button>
      </div>
    </div>
  );
}

/* ---------------- OPPORTUNITIES ---------------- */
function Opportunities({token}){
  const [branch, setBranch] = useState("All");
  const [year, setYear] = useState("All");
  const [skill, setSkill] = useState("");
  const [type, setType] = useState("All");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const types = ["All","Internship","Hackathon","Job","Workshop","Training","Coding Contest","Scholarship"];

  useEffect(()=>{
    setLoading(true); setError("");
    const handle = setTimeout(()=>{
      api.opportunities(token, {branch, year, skill, type}).then(d=>setItems(d.opportunities)).catch(e=>setError(e.message)).finally(()=>setLoading(false));
    }, 250); // small debounce for the skill text field
    return ()=>clearTimeout(handle);
  },[token, branch, year, skill, type]);

  const typeTone = {Internship:"indigo",Hackathon:"coral",Job:"teal",Workshop:"gold",Training:"indigo","Coding Contest":"coral","Scholarship":"gold"};

  return (
    <div>
      <div className="page-head">
        <div className="page-eyebrow">OPPORTUNITY RADAR · LIVE DATA</div>
        <h1 className="page-title">Opportunities picked for engineering students</h1>
        <p className="page-desc">Filter by what fits you — results come straight from the database.</p>
      </div>
      <div className="filter-bar">
        <Icon name="filter" size={15} style={{color:"var(--ink-faint)"}}/>
        <select className="select" value={type} onChange={e=>setType(e.target.value)}>{types.map(t=><option key={t} value={t}>{t==="All"?"All types":t}</option>)}</select>
        <select className="select" value={branch} onChange={e=>setBranch(e.target.value)}><option value="All">All branches</option>{BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}</select>
        <select className="select" value={year} onChange={e=>setYear(e.target.value)}><option value="All">All years</option>{[1,2,3,4].map(y=><option key={y} value={y}>{YEAR_WORD[y]} Year</option>)}</select>
        <input className="select" placeholder="Skill, e.g. SQL" value={skill} onChange={e=>setSkill(e.target.value)} style={{minWidth:140}}/>
      </div>
      <ErrorNote message={error}/>
      {loading ? <Spinner/> : (
        <div className="grid grid-3">
          {items.map(o=>(
            <div key={o.id} className="card opp-card">
              <div className="opp-top">
                <div><p className="opp-title">{o.title}</p><div className="opp-org">{o.org}</div></div>
                <Badge tone={typeTone[o.type]||"indigo"}>{o.type}</Badge>
              </div>
              <div className="opp-tags">
                {o.branch.length<6 && o.branch.map(b=><Badge key={b} tone="outline">{b}</Badge>)}
                {o.skills.map(s=><Badge key={s} tone="outline">{s}</Badge>)}
              </div>
              <div className="opp-foot"><span><Icon name="clock" size={12}/> {o.deadline}</span><span>{o.mode}</span></div>
            </div>
          ))}
          {items.length===0 && <div className="card empty-state" style={{gridColumn:"1/-1"}}><Icon name="compass" size={28}/><p>No opportunities match these filters.</p></div>}
        </div>
      )}
    </div>
  );
}

/* ---------------- ROADMAP ---------------- */
function Roadmap({token}){
  const [year, setYear] = useState(2);
  const [branch, setBranch] = useState("CSE");
  const [semester, setSemester] = useState(4);
  const [interest, setInterest] = useState("Software / SDE");
  const [items, setItems] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  function generate(){
    setLoading(true); setError("");
    api.roadmap(token, interest).then(d=>setItems(d.items)).catch(e=>setError(e.message)).finally(()=>setLoading(false));
  }
  useEffect(()=>{ generate(); },[]); // eslint-disable-line

  return (
    <div>
      <div className="page-head">
        <div className="page-eyebrow">SEMESTER ROADMAP · LIVE DATA</div>
        <h1 className="page-title">Your personalised semester plan</h1>
        <p className="page-desc">Tell us where you are — we'll suggest what to focus on this semester.</p>
      </div>
      <div className="card roadmap-form">
        <div className="field"><label>Year</label><select className="select" style={{width:"100%"}} value={year} onChange={e=>setYear(Number(e.target.value))}>{[1,2,3,4].map(y=><option key={y} value={y}>{YEAR_WORD[y]} Year</option>)}</select></div>
        <div className="field"><label>Branch</label><select className="select" style={{width:"100%"}} value={branch} onChange={e=>setBranch(e.target.value)}>{BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}</select></div>
        <div className="field"><label>Semester</label><select className="select" style={{width:"100%"}} value={semester} onChange={e=>setSemester(Number(e.target.value))}>{Array.from({length:8},(_,i)=>i+1).map(s=><option key={s} value={s}>Semester {s}</option>)}</select></div>
        <div className="field"><label>Career interest</label><select className="select" style={{width:"100%"}} value={interest} onChange={e=>setInterest(e.target.value)}>{CAREER_INTERESTS.map(k=><option key={k} value={k}>{k}</option>)}</select></div>
        <button className="btn btn-primary" onClick={generate} disabled={loading}><Icon name="spark" size={15}/> Generate Roadmap</button>
      </div>
      <ErrorNote message={error}/>
      {loading && <Spinner/>}
      {!loading && items && (
        <div className="card" style={{padding:22, marginTop:20}}>
          <div className="section-title">Suggested activities — {branch}, {YEAR_WORD[year]} Year, Sem {semester}<Badge tone="gold">{interest}</Badge></div>
          <div className="timeline">
            {items.map((it,i)=>(
              <div key={i} className="tl-item">
                <div className="tl-dot"/>
                <div className="card tl-card"><p className="tl-title">{it}</p><p className="tl-desc">Recommended step {i+1} of {items.length} for your {interest.toLowerCase()} track this semester.</p></div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- EXPERIENCES ---------------- */
function Experiences({token}){
  const [cat, setCat] = useState("All");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(()=>{
    setLoading(true); setError("");
    api.experiences(token, cat).then(d=>setItems(d.experiences)).catch(e=>setError(e.message)).finally(()=>setLoading(false));
  },[token, cat]);

  return (
    <div>
      <div className="page-head">
        <div className="page-eyebrow">SENIOR EXPERIENCES · ANONYMOUS · LIVE DATA</div>
        <h1 className="page-title">Who's been through this?</h1>
        <p className="page-desc">Real situations verified seniors have faced — shared with year and branch only, never identity.</p>
      </div>
      <div className="chip-row">
        <button className={"chip" + (cat==="All"?" active":"")} onClick={()=>setCat("All")}>All</button>
        {CATEGORIES.map(c=><button key={c} className={"chip" + (cat===c?" active":"")} onClick={()=>setCat(c)}>{c}</button>)}
      </div>
      <ErrorNote message={error}/>
      {loading ? <Spinner/> : (
        <div className="grid grid-3">
          {items.map((e,i)=>(
            <div key={i} className="card exp-card">
              <div className="exp-top">
                <IdHex year={e.year} branch={e.branch}/>
                <div><Badge tone="teal" icon="shield">Verified Senior</Badge><div className="exp-topic">{YEAR_WORD[e.year]}-Year {e.branch} student</div></div>
              </div>
              <p className="exp-quote">{e.topic} — available to answer related questions anonymously.</p>
              <Badge tone="outline">{e.category}</Badge>
            </div>
          ))}
          {items.length===0 && <div className="card empty-state" style={{gridColumn:"1/-1"}}><Icon name="users" size={28}/><p>No experiences in this category yet.</p></div>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
